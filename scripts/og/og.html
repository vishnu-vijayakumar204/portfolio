<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: "InterOG"; src: url("inter-latin.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #020617; color: #f8fafc; font-family: "InterOG", sans-serif; position: relative; overflow: hidden; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(37,107,247,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(37,107,247,.10) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: radial-gradient(ellipse at 30% 40%, #000 20%, transparent 75%); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #256bf7; }
  .wrap { position: absolute; left: 96px; top: 0; bottom: 0; right: 80px; display: flex; flex-direction: column; justify-content: center; }
  .mono { font-size: 30px; font-weight: 800; color: #256bf7; letter-spacing: -0.01em; margin-bottom: 36px; }
  h1 { font-size: 92px; line-height: 1.02; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 26px; }
  .role { font-size: 42px; font-weight: 600; color: #6b9bff; margin-bottom: 40px; }
  .stack { font-size: 30px; color: #94a3b8; font-weight: 500; margin-bottom: 10px; }
  .tag { font-size: 30px; color: #94a3b8; font-weight: 500; }
</style>
<div class="grid"></div><div class="bar"></div>
<div class="wrap">
  <div class="mono">VV</div>
  <h1>Vishnu Vijayakumar</h1>
  <div class="role">Technical Lead @ Myntra</div>
  <div class="stack">React • Next.js • React Native</div>
  <div class="tag">Product Engineering</div>
</div>
